name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
            lua: lua5.4
            luac: luac5.4
          - os: macos-15
            python: "3.14"
            lua: lua
            luac: luac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Lua and fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 fonts-dejavu-core
      - name: Install Lua (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lua@5.4
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
      - name: Check Lua syntax
        env:
          BT_LUAC: ${{ matrix.luac }}
        run: |
          for file in hammerspoon/*.lua tests/*.lua; do
            "$BT_LUAC" -p "$file"
          done
      - name: Test exports, demo, and installer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test benchmark pricing and publication
        run: python -m unittest discover -s docs/benchmarks/2026-09-japanese-english -p 'test_*.py' -v
      - name: Test translator policies and state transitions
        env:
          BT_LUA: ${{ matrix.lua }}
        run: |
          for file in tests/test_*.lua; do
            "$BT_LUA" "$file"
          done
      - name: Build the offline demo
        run: python scripts/demo.py --output demo-output
